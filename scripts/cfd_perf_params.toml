"num_x_blocks" = 4
"num_y_blocks" = 4
"num_z_blocks" = 4

"x_start" = 0.3
"y_start" = 0.1
"z_start" = 0.2

"dx" = 0.05
"dy" = 0.10
"dz" = 0.20

inmatfilt_1 = "BYUT6"
inmatfilt_2 = "BYUT6"

inmatfilt_X_coeffs = [0.5]
inmatfilt_XX_coeffs = [0.5]

