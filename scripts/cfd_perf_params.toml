# params used by cfd_perf_compare.py
# eleorder is overwritten on the command line per run

"eleorder" = 4

"deriv_type" = "JTT6"
"deriv_type_2nd" = "JTT6"
"deriv1_matrixID" = 1
"deriv2_matrixID" = 1

"deriv_stencil_order" = 6

# inner-loop reps inside the test binary's profiler
"num_tests" = 2000

# number of field variables processed per timed step (RHS-style var loop).
# nvar=1 reproduces the original single-variable timing. cfd_perf_compare.py
# overrides this per-run when sweeping the nvar axis.
"nvar" = 1

"data_init" = 2

